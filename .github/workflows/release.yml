name: Release

# Push tag vX.Y.Z (mis. lewat `npm version patch && git push --follow-tags`)
# untuk membangun installer dan menerbitkannya ke GitHub Releases.
# Cimol yang sudah terpasang akan mendeteksi rilis ini lewat latest.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Cek versi package.json sama dengan tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME tidak sama dengan versi package.json ($version)"
            exit 1
          fi

      - run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Terbitkan ke GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Cimol ${tag#v}" --generate-notes
          gh release upload "$tag" dist/CimolSetup-*.exe dist/CimolSetup-*.exe.blockmap dist/latest.yml --clobber
